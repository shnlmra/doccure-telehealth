version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: doccure_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telehealth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telehealth_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-telehealth_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telehealth_user} -d ${POSTGRES_DB:-telehealth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: doccure_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      PORT: ${BACKEND_PORT:-4000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER:-telehealth_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-telehealth_secure_pass_123}
      DATABASE_NAME: ${POSTGRES_DB:-telehealth_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_me_in_production}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: doccure_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      PORT: ${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
